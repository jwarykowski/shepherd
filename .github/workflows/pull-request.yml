name: pull-request

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: vet
        run: go vet ./...

      # also checks formatting: gofumpt and goimports (.golangci.yml)
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

      - name: test
        run: go test ./...

      - name: build
        run: go build -o bin/shepherd .
