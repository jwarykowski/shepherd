# Releases on a version bump in herdr-plugin.toml: release.sh tags the commit,
# then GoReleaser builds the binaries, publishes the GitHub release and opens
# the Homebrew formula pull request, which is merged here. Stable versions
# release from master, pre-releases (-alpha, -beta) from pro.
name: release

on:
  push:
    branches: [master, pro]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        run: .github/scripts/release.sh "${GITHUB_REF_NAME}"
      - if: steps.tag.outputs.tag != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # a 401 later is far less clear than failing here
      - if: steps.tag.outputs.tag != ''
        name: check the GitHub token
        run: GH_TOKEN="$GH_RELEASE_TOKEN" gh api user --jq '"publishing as " + .login'
        env:
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
      - if: steps.tag.outputs.tag != ''
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true
      # GoReleaser reads the GitHub token from its file, since the runner's own
      # GITHUB_TOKEN (Forgejo's) would otherwise win. The release goes on
      # GitHub's copy; the formula pull request goes to the tap.
      - if: steps.tag.outputs.tag != ''
        name: release
        run: |
          mkdir -p ~/.config/goreleaser
          printf '%s' "$GH_RELEASE_TOKEN" > ~/.config/goreleaser/github_token
          unset GITHUB_TOKEN
          goreleaser release --clean
        env:
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
      - if: steps.tag.outputs.tag != ''
        run: |
          GH_TOKEN="$GH_RELEASE_TOKEN" gh pr merge -R jwarykowski/homebrew-tap \
            --squash --delete-branch "${{ steps.tag.outputs.formula }}-${{ steps.tag.outputs.version }}"
        env:
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
